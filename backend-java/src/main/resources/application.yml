spring:
  application:
    name: petcliff-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/petcliff}
    username: ${DB_USER:petcliff}
    password: ${DB_PASSWORD:petcliff}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${PORT:8080}

petcliff:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-a-very-long-random-string-min-32-bytes}
    access-token-ttl-minutes: 30
    refresh-token-ttl-days: 30
  kit:
    min-items: 3
    discount-percent: 20
  free-shipping-threshold-cents: 10000
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
    success-url: ${STRIPE_SUCCESS_URL:http://localhost:3000/checkout/success}
    cancel-url: ${STRIPE_CANCEL_URL:http://localhost:3000/cart}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  media:
    bucket: ${MEDIA_BUCKET:}
    cdn: ${MEDIA_CDN:}
    region: ${AWS_REGION:us-west-2}
